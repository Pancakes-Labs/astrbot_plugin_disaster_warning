name: 📦 Draft Release (Tag with v)

on:
  push:
    tags:
      - "*v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 编译 WebUI 并打包插件
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_NAME="astrbot_plugin_disaster_warning"
          BUILD_ROOT="${RUNNER_TEMP}/plugin-build"
          STAGE_DIR="${BUILD_ROOT}/${PACKAGE_NAME}"
          ZIP_NAME="${PACKAGE_NAME}-${GITHUB_REF_NAME}.zip"

          rm -rf "${BUILD_ROOT}"  
          mkdir -p "${STAGE_DIR}"

          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.idea/' \
            --exclude '.devin/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            --exclude '.DS_Store' \
            ./ "${STAGE_DIR}/"

          pushd "${STAGE_DIR}"

          if [[ ! -d "admin/js" ]]; then
            echo "::error::未找到 admin/js，无法编译 WebUI"
            exit 1
          fi

          BUILD_JS_DIR="admin/.js-build"
          BABEL_TOOLS_DIR="${RUNNER_TEMP}/babel-tools"
          rm -rf "${BUILD_JS_DIR}"
          mkdir -p "${BUILD_JS_DIR}"

          rm -rf "${BABEL_TOOLS_DIR}"
          mkdir -p "${BABEL_TOOLS_DIR}"
          pushd "${BABEL_TOOLS_DIR}"
          npm init -y >/dev/null 2>&1
          npm install --no-save @babel/core @babel/cli @babel/preset-react @babel/plugin-transform-block-scoping
          popd

          # 说明：
          # WebUI 当前采用多文件全局脚本结构，很多文件会重复声明 `const { ... } = React/MaterialUI`。
          # 浏览器按普通 script 执行时，const/let 不允许重声明，会触发
          # "Identifier has already been declared" 并导致白屏。
          # 仅使用 preset-react（JSX 编译）+ plugin-transform-block-scoping（const/let → var），
          # 不使用 preset-env，避免其对现代浏览器目标跳过 block-scoping 转换导致 const 残留。
          NODE_PATH="${BABEL_TOOLS_DIR}/node_modules" \
          "${BABEL_TOOLS_DIR}/node_modules/.bin/babel" admin/js \
            --extensions ".js,.jsx" \
            --out-dir "${BUILD_JS_DIR}" \
            --presets @babel/preset-react \
            --plugins @babel/plugin-transform-block-scoping \
            --no-babelrc

          rm -rf admin/js
          mv "${BUILD_JS_DIR}" admin/js

          sed -i 's|<script type="text/babel" src="js/\([^"]*\)\.jsx" defer></script>|<script src="js/\1.js" defer></script>|g' admin/index.html
          sed -i 's|<script type="text/babel" src="js/\([^"]*\)\.js" defer></script>|<script src="js/\1.js" defer></script>|g' admin/index.html
          sed -i '/lib\/babel\.min\.js/d' admin/index.html
          rm -f admin/lib/babel.min.js

          if grep -q 'text/babel' admin/index.html; then
            echo "::error::WebUI 编译后 index.html 仍包含 text/babel 引用"
            exit 1
          fi

          if find admin/js -type f -name '*.jsx' | grep -q .; then
            echo "::error::WebUI 编译后仍存在 .jsx 源文件"
            exit 1
          fi

          if grep -R -n -E '^[[:space:]]*const[[:space:]]+\{[^}]+\}[[:space:]]*=[[:space:]]*(React|MaterialUI)[[:space:]]*;' admin/js >/dev/null; then
            echo "::error::WebUI 编译后仍包含顶层 const 解构，可能导致浏览器全局重声明"
            exit 1
          fi

          # 防线一：用 Node 的 V8 解析器以“经典脚本”模式逐文件校验，
          # 从根本上消除漏报（动态 import("x") 与注释中的 import 均不会被误伤）。
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const vm = require('vm');
          const root = 'admin/js';
          const files = [];
          (function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.js')) files.push(full);
            }
          })(root);
          let failed = 0;
          for (const file of files) {
            try {
              new vm.Script(fs.readFileSync(file, 'utf8'), { filename: file });
            } catch (err) {
              const first = String(err.message).split('\n')[0];
              console.error('::error file=' + file + '::经典脚本解析失败，疑似残留 ESM import/export：' + first);
              failed++;
            }
          }
          if (failed > 0) {
            console.error('WebUI 编译产物中有 ' + failed + '/' + files.length + ' 个文件无法作为经典脚本解析');
            process.exit(1);
          }
          console.log('WebUI 经典脚本校验通过：' + files.length + ' 个文件全部可解析');
          NODE

          # 防线二：显式拦截 react/jsx-runtime 与 react/jsx-dev-runtime 说明符，
          # 它们是 @babel/preset-react automatic runtime 的产物特征，无法在经典 <script> 下运行。
          if grep -R -n -E '"(react/jsx-runtime|react/jsx-dev-runtime)"' admin/js --include='*.js' >/dev/null; then
            echo "::error::WebUI 编译产物引用了 react/jsx-runtime，说明使用了 automatic runtime，需改回 classic runtime"
            grep -R -n -E '"(react/jsx-runtime|react/jsx-dev-runtime)"' admin/js --include='*.js' | head -n 20
            exit 1
          fi

          popd

          mkdir -p "${GITHUB_WORKSPACE}/dist"
          cd "${BUILD_ROOT}"
          zip -r "${GITHUB_WORKSPACE}/dist/${ZIP_NAME}" "${PACKAGE_NAME}"

      - name: 上传打包产物
        uses: actions/upload-artifact@v7
        with:
          name: plugin-zip-${{ github.ref_name }}
          path: dist/*.zip
          if-no-files-found: error

      - name: 发布 Draft Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: dist/*.zip
