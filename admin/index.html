    <!-- 主题快速同步拦截器，防止白屏期闪烁，在首屏渲染前读取并挂载主题样式。
         优先级：用户显式保存的偏好 > 系统 prefers-color-scheme > 默认亮色。
         同时挂载 data-theme 属性与 theme-dark 类，保证 [data-theme='dark'] 选择器
         在登录/加载阶段（React 挂载前）同样生效。
         注意：脚本在 <head> 中执行时 body 尚未解析，需对 document.body 做空值防护。 -->
    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem('theme');
                var isDark = savedTheme === 'dark';
                if (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    isDark = true;
                }
                if (isDark) {
                    document.documentElement.classList.add('theme-dark');
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
                /* body 挂载 data-theme 与 dark-theme 类：与 useThemeSync 的映射保持一致，
                   保证 body.dark-theme 选择器（如 .top-bar::before、.config-header 等）在
                   首屏/登录阶段（React 挂载前）同样生效，避免暗色模式闪白 */
                var applyBodyTheme = function () {
                    if (isDark) {
                        document.body.classList.add('dark-theme');
                    } else {
                        document.body.classList.remove('dark-theme');
                    }
                    document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
                };
                if (document.body) {
                    applyBodyTheme();
                } else {
                    document.addEventListener('DOMContentLoaded', applyBodyTheme);
                }
            } catch (e) {
                /* 忽略本地存储不可用的隐私模式场景 */
            }
        })();
    </script>

                <span class="bl-stage-dot" data-stage="3"></span>

        <!-- 面板访问身份校验表单（在令牌失效时通过 authBootstrap.js 自动激活） -->

            <div class="boot-loader__logo boot-loader__logo--static" aria-hidden="true">
                <img src="../logo.png" alt="" width="56" height="56">
            </div>
            <div class="boot-loader__title">灾害预警管理端</div>
            <div class="boot-loader__subtitle boot-loader__subtitle--login">请输入访问密码</div>
            <div class="bl-error" id="bl-login-error" role="alert" aria-live="polite"></div>
            <input
                id="bl-username"
                type="text"
                autocomplete="username"
                tabindex="-1"
                aria-hidden="true"
                style="position:absolute;opacity:0;pointer-events:none;height:0;width:0;border:0;padding:0;"
            >
            <div class="bl-input-wrap">
                <label class="visually-hidden" for="bl-password">访问密码</label>
                <input id="bl-password" class="bl-input" type="password" placeholder="密码" autocomplete="current-password" aria-describedby="bl-login-error">
                <button class="bl-toggle-pw" type="button" id="bl-toggle-pw" title="显示/隐藏密码" aria-label="显示密码" aria-pressed="false">👁️</button>
            </div>
            <button id="bl-submit" class="bl-submit-btn" type="submit">登录</button>
        </form>
